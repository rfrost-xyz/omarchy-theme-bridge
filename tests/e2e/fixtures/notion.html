body { margin: 0; background: var(--c-bacPri); color: var(--c-texPri); font: 14px sans-serif; }
#sidebar { background: var(--c-bacSec); color: var(--c-texSec); }
#sidebar .selected { background: var(--ca-sidIteSelBac); }
#muted { color: var(--c-texTer); }
#link { color: var(--c-palUiBlu700, var(--c-palUiBlu600)); }
#menu, #dialog { background: var(--c-popBac); color: var(--c-texPri); border: 1px solid var(--c-borPri); }
#search { background: var(--ca-popWaxPapBac); color: var(--c-texPri); }
#search-hover { background: var(--ca-palTraGra200); }
#glass-header { background: var(--ca-glaWas); color: var(--c-texSec); }

<body class="notion-body {{MODE}}-mode">
<script>
  if (document.body.classList.contains('dark-mode')) document.body.classList.add('dark', 'notion-dark-theme');
</script>
<nav id="sidebar"><div class="selected">Page</div><div>Other page</div></nav>
<main>
  <p id="muted">Muted text</p>
  <a id="link" href="#">Link</a>
  <div id="menu" role="menu">Menu</div>
  <div id="dialog" role="dialog">Dialog</div>
  <div id="search" role="dialog">Search <div id="search-hover">Recent page</div></div>
  <div id="glass-header">Floating header</div>
  <pre id="code">const x = 1;</pre>
  <div id="red-block">Authored red block</div>
  <span id="blue-text">Authored blue text</span>
  <div id="grey-block">Authored grey block</div>
  <div id="red-bg">Default text on an authored red background</div>
  <div id="blue-bg">Default text on an authored blue background</div>
  <div id="yellow-bg">Default text on an authored yellow background</div>
  <div id="opposite-holder"></div>
</main>
<script>
  // A container in the opposite theme, such as a tooltip, keeps Notion's colours.
  const opposite = document.createElement('div');
  opposite.id = 'opposite';
  opposite.className = document.body.classList.contains('notion-dark-theme') ? 'notion-light-theme' : 'notion-dark-theme';
  opposite.textContent = 'Opposite theme tooltip';
  document.getElementById('opposite-holder').append(opposite);
</script>
</body>
