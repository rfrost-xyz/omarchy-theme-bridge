<html><head><meta charset="utf-8"><title>Grok.com fixture</title><style>
:root, .light {

  --surface-l2-active: hsl(var(--neutral-150));
  --surface-l3: hsl(var(--neutral-150));
  --surface-l4: hsl(var(--neutral-200));
  --surface-l4-hover: hsl(0 0% 78%);
  --surface-elevated: hsl(var(--white));
  --surface-invert: hsl(var(--neutral-1000));
  --fg-primary: hsl(var(--neutral-1000));

  --fg-tertiary: hsl(var(--neutral-400));
  --fg-quaternary: hsl(var(--neutral-300));
  --fg-invert: hsl(var(--white));
  --fg-danger: hsl(var(--red-500));
  --fg-success: hsl(var(--green-600));
  --fg-warning: hsl(var(--yellow-700));
  --fg-link: hsl(var(--blue-500));
  --fg-link-hover: hsl(var(--blue-300));
  --border-l1: hsl(var(--black) / 6%);
  --border-l2: hsl(var(--black) / 10%);
  --border-l3: hsl(var(--black) / 15%);
  --ring: hsl(var(--neutral-400));

  --surface-l2: hsl(var(--neutral-900));

  --surface-l4: hsl(var(--neutral-700));
  --surface-l4-hover: hsl(var(--neutral-700));
  --surface-elevated: hsl(var(--neutral-700));
  --surface-invert: hsl(var(--white));
  --fg-primary: hsl(var(--white));
  --fg-secondary: hsl(var(--neutral-300));
  --fg-tertiary: hsl(var(--neutral-400));
  --fg-quaternary: hsl(var(--neutral-500));
  --fg-invert: hsl(var(--neutral-1000));
  --fg-danger: hsl(var(--red-300));
  --fg-success: hsl(var(--green-300));
  --fg-warning: hsl(var(--yellow-300));
  --fg-link: hsl(var(--blue-300));
  --fg-link-hover: hsl(var(--blue-500));
  --border-l1: hsl(var(--white) / 8%);
  --border-l2: hsl(var(--white) / 14%);
  --border-l3: hsl(var(--white) / 20%);
  --button-filled: hsl(var(--white));
  --button-filled-hover: hsl(var(--neutral-200));
  --button-filled-active: hsl(var(--neutral-300));
  --button-secondary-fill: hsl(var(--white) / 8%);
  --input: hsl(var(--neutral-700));
  --input-border: hsl(var(--neutral-200) / 4%);
  --input-border-focus: hsl(var(--white) / 16%);
  --background-color: hsl(var(--neutral-950));

body {
  --surface-base: #f9f8f7; --surface-inset: hsl(20 13% 95.5%);
  --surface-l1: hsl(20 13% 95.5%); --surface-l1-hover: #f0eeed;
  --surface-l2: #eae8e6; --surface-l2-active: #e6e5e3;

  --fg-secondary: #636363; --fg-tertiary: #858585;
  --border-l1: hsl(36 20% 5% / 4%); --border-l2: hsl(36 20% 5% / 8%);
  --fg-accent: #0890ff; --fg-accent-hover: #0078d8;
  --surface-user-bubble: #f0efed; --surface-composer: #fff;
  --border-composer: #e6e5e3;
  --fg-diff-add: #2f7448; --fg-diff-del: #a7444b;

:root.dark body {

body { background: var(--surface-base); color: var(--fg-primary); }
#sidebar { background: var(--surface-l1); color: var(--fg-secondary); }
#secondary { color: var(--fg-secondary); } #muted { color: var(--fg-tertiary); }
#link { color: var(--fg-link); }
#dialog { background: var(--surface-elevated); color: var(--fg-primary); border: 1px solid var(--border-l2); }
#input { background: var(--input); color: var(--fg-primary); border: 1px solid var(--input-border); }
#input:focus { border-color: var(--input-border-focus); }
#button { background: var(--button-filled); color: var(--fg-invert); border: none; }

#button:active { background: var(--button-filled-active); }
#composer { background: var(--surface-composer); border: 1px solid var(--border-composer); }
#bubble { background: var(--surface-user-bubble); color: var(--fg-primary); }
#legacy { background: var(--background); color: var(--fg-primary); }
#scope, #inserted { background: var(--surface-l2); color: var(--fg-primary); }
#deep { background: var(--surface-l4); color: var(--fg-primary); }
#deep-hover { background: var(--surface-l4-hover); color: var(--fg-primary); }
#deep-secondary { color: var(--fg-secondary); }
#deep-muted { color: var(--fg-tertiary); }
#deep-link { color: var(--fg-link); }
#opposite { background: var(--surface-base); color: var(--fg-primary); }
#danger { color: var(--fg-danger); background: var(--button-danger-fill); }
#success { color: var(--fg-success); } #warning { color: var(--fg-warning); }
#added { color: var(--fg-diff-add); } #removed { color: var(--fg-diff-del); }
#incognito { color: var(--fg-incognito); background: var(--surface-incognito); }
#brand { color: var(--fg-accent); }
#banner { background: var(--surface-banner); color: white; }
#badge { background: #f91880; color: white; }
#code { --tw-prose-pre-code: #e5e7eb; --tw-prose-pre-bg: #1e2939; color: var(--tw-prose-pre-code); background: var(--tw-prose-pre-bg); }

#gradient { background: linear-gradient(135deg, hsl(var(--blue-300)), hsl(var(--blue-500))); }
</style><script>
